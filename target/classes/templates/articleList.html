<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>新闻列表</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="format-detection" content="telephone=no">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<!-- Fonts-->
		<link rel="stylesheet" type="text/css" href="/assets/fonts/fontawesome/font-awesome.min.css">
		<link rel="stylesheet" type="text/css" href="/assets/fonts/pe-icon/pe-icon.css">
		<!-- Vendors-->
		<link rel="stylesheet" type="text/css" href="/assets/vendors/bootstrap/grid.css">
		<link rel="stylesheet" type="text/css" href="/assets/vendors/magnific-popup/magnific-popup.min.css">
		<link rel="stylesheet" type="text/css" href="/assets/vendors/swiper/swiper.css">
		<!-- App & fonts-->
		<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700|Open+Sans:400,700">
		<link rel="stylesheet" type="text/css" id="app-stylesheet" href="/assets/css/main.css">
	</head>
	
	<body>
		<div class="page-wrap" id="root">
			
			<!-- header -->
			<header class="header header--fixed">
				<div class="header__inner">
					<div class="header__logo"><a href="/index.html"><img src="/assets/img/logo.png" alt="" style="width: 122px;"/></a></div>
					<div class="navbar-toggle" id="fs-button">
						<div class="navbar-icon"><span></span></div>
					</div>
				</div>
				
				<!-- fullscreenmenu__module -->
				<div class="fullscreenmenu__module" trigger="#fs-button">
					
					<!-- overlay-menu -->
					<nav class="overlay-menu">
						
						<!--  -->
						<ul class="wil-menu-list">
								<li><a href="/index.html">首页</a>
								</li>
								<li><a href="/about.html">关于我们</a>
								</li>
								<li><a href="/work.html">栏目分类</a>
								</li>
								<li class="current-menu-item"><a href="/article/list">新闻列表</a>
								</li>
								<li><a href="/contact.html">联系我们</a>
								</li>
								<li><a href="/login">登录</a>
								</li>
						</ul>
						
					</nav><!-- End / overlay-menu -->
					
				</div><!-- End / fullscreenmenu__module -->
				
			</header><!-- End / header -->
			
			<!-- Content-->
			<div class="wil-content">
				
				<!-- Section -->
				<section class="awe-section">
					<div class="container">
						
						<!-- page-title -->
						<div class="page-title">
							<h2 class="page-title__title">新闻管理</h2>
							<p class="page-title__text">管理网站新闻内容</p>
							<div class="page-title__divider"></div>
						</div><!-- End / page-title -->
						
					</div>
				</section>
				<!-- End / Section -->
				
				<!-- Section -->
				<section class="awe-section bg-gray">
					<div class="container">
						<div class="row">
							<div class="col-lg-12">
								
								<div class="card">
									<div class="card-header">
										<div class="row">
											<div class="col-md-6">
												<h3 class="card-title">新闻列表</h3>
											</div>
											<div class="col-md-6 text-right">
												<a href="/article/edit" class="btn btn-primary">
													<i class="fa fa-plus"></i> 新增新闻
												</a>
											</div>
										</div>
									</div>
									<div class="card-body">
										<table class="table table-bordered">
											<thead>
												<tr>
													<th>ID</th>
													<th>标题</th>
													<th>内容</th>
													<th>操作</th>
												</tr>
											</thead>
											<tbody>
												<tr th:each="article : ${list}">
													<td th:text="${article.id}"></td>
													<td th:text="${article.title}"></td>
													<td th:text="${#strings.abbreviate(article.content, 100)}"></td>
													<td>
														<a th:href="@{/article/edit(id=${article.id})}" class="btn btn-sm btn-info" style="margin-right: 5px;">
															<i class="fa fa-pencil"></i> 编辑
														</a>
														<a th:href="@{/article/delete/{id}(id=${article.id})}" class="btn btn-sm btn-danger" 
														   onclick="return confirm('确定要删除这条新闻吗？')">
															<i class="fa fa-trash"></i> 删除
														</a>
													</td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>
								
							</div>
						</div>
					</div>
				</section>
				<!-- End / Section -->
				
			</div>
			<!-- End / Content-->
			
			<!-- footer -->
			<footer class="footer">
				<div class="container">
					<div class="footer__inner">
						<div class="row">
							<div class="col-lg-6">
								<div class="footer__content">
									<p>© 2025 新闻资讯门户. All rights reserved.</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			</footer>
			<!-- End / footer -->
			
		</div>
		<!-- Vendors-->
		<script type="text/javascript" src="/assets/vendors/jquery/jquery.min.js"></script>
		<script type="text/javascript" src="/assets/vendors/imagesloaded/imagesloaded.pkgd.js"></script>
		<script type="text/javascript" src="/assets/vendors/isotope-layout/isotope.pkgd.js"></script>
		<script type="text/javascript" src="/assets/vendors/jquery-one-page/jquery.nav.min.js"></script>
		<script type="text/javascript" src="/assets/vendors/jquery.easing/jquery.easing.min.js"></script>
		<script type="text/javascript" src="/assets/vendors/jquery.matchHeight/jquery.matchHeight.min.js"></script>
		<script type="text/javascript" src="/assets/vendors/magnific-popup/jquery.magnific-popup.min.js"></script>
		<script type="text/javascript" src="/assets/vendors/masonry-layout/masonry.pkgd.js"></script>
		<script type="text/javascript" src="/assets/vendors/swiper/swiper.jquery.js"></script>
		<script type="text/javascript" src="/assets/vendors/menu/menu.js"></script>
		<script type="text/javascript" src="/assets/vendors/typed/typed.min.js"></script>
		<!-- App-->
		<script type="text/javascript" src="/assets/js/main.js"></script>
	</body>
</html>
