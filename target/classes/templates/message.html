							<div class="col-md-4 col-lg-3 ">

									<!-- form-item -->
									<div class="form-item form-item--half">

									<!-- form-item -->
									<div class="form-item form-item--half">

									<!-- form-item -->
									<div class="form-item">
										<input id="msg-subject" class="form-control" type="text" name="subject" placeholder="主题"/>

									<!-- form-item -->
									<div class="form-item">
										<textarea id="msg-content" class="form-control" name="content" placeholder="您的留言或新闻线索" style="min-height:200px;"></textarea>
									</div><!-- End / form-item -->
									
									
									<!-- form-item -->
									<div class="form-item">
										<button id="send-message" class="md-btn md-btn--primary md-btn--lg " type="button">发送消息</button>
									</div><!-- End / form-item -->
									
									<!-- 留言列表 -->
									<div id="message-list" style="margin-top:20px;">

			<!-- App-->
			<script type="text/javascript" src="/assets/js/main.js"></script>
			
			<script>
			// 留言提交处理
			$(function(){
				$('#send-message').on('click', function () {
					var name = $('#msg-name').val();
					var email = $('#msg-email').val();
					var content = $('#msg-content').val();
					if (!content || !content.trim()) {
						alert('留言内容不能为空');
						return;
					}
					var btn = $(this);
					btn.prop('disabled', true);
					$.post('/message/add', {name: name, email: email, content: content}, function (resp) {
						if (resp.success) {
							var msg = resp.data;
							var html = '<div class="comment-item" style="padding:10px 0; border-bottom:1px solid #eee;">'
								+ '<div style="font-weight:600;">' + $('<div>').text(msg.name).html() + ' <small style="color:#999; font-weight:400;">' + (msg.createdAt||'') + '</small></div>'
								+ '<div style="margin-top:8px; white-space:pre-wrap;">' + $('<div>').text(msg.content).html() + '</div></div>';
							$('#message-list').prepend(html);
							$('#msg-content').val(''); $('#msg-subject').val(''); $('#msg-name').val(''); $('#msg-email').val('');
							alert('留言成功');
						} else {
							alert(resp.message || '留言失败');
						}
					}).fail(function(){
						alert('留言请求失败');
					}).always(function(){
						btn.prop('disabled', false);
					});
				});
			});
			</script>
