<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<title>登录</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<!-- Fonts-->
	<link rel="stylesheet" type="text/css" href="/assets/fonts/fontawesome/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="/assets/fonts/pe-icon/pe-icon.css">
	<!-- Vendors-->
	<link rel="stylesheet" type="text/css" href="/assets/vendors/bootstrap/grid.css">
	<link rel="stylesheet" type="text/css" href="/assets/vendors/magnific-popup/magnific-popup.min.css">
	<link rel="stylesheet" type="text/css" href="/assets/vendors/swiper/swiper.css">
	<!-- App & fonts-->
	<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700|Open+Sans:400,700">
	<link rel="stylesheet" type="text/css" id="app-stylesheet" href="/assets/css/main.css">
	
	<style>
		/* 登录页面背景 */
		.page-wrap {
			background: url('/assets/img/82820598_p0.png') no-repeat center center fixed;
			background-size: cover;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		/* 内容区域垂直居中 */
		.wil-content {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 60px 0;
		}

		/* Section 样式覆盖 */
		.wil-content .awe-section {
			padding: 0;
			width: 100%;
		}

		/* 登录表单容器 */
		.login-form {
			background: rgba(255, 255, 255, 0.95);
			padding: 40px;
			border-radius: 12px;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
			max-width: 420px;
			margin: 0 auto;
		}

		/* 输入框样式 */
		.login-form .input-item input {
			width: 100%;
			padding: 14px 20px;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 15px;
			background: #f9f9f9;
			transition: all 0.3s ease;
		}

		.login-form .input-item input:focus {
			border-color: #6c5ce7;
			background: #fff;
			box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
		}

		.login-form .input-item {
			margin-bottom: 20px;
		}

		/* 登录按钮样式 */
		.login-form .btn {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			transition: all 0.3s ease;
		}

		.login-form .btn:hover {
			background: linear-gradient(135deg, #5b4cc4 0%, #8e85f3 100%);
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
		}

		/* 页面标题样式 */
		.page-title {
			text-align: center;
			margin: 0 0 60px 0;
			padding: 0;
		}

		.page-title__title {
			font-size: 32px;
			font-weight: 700;
			color: #2d3436;
		}

		.page-title__divider {
			width: 60px;
			height: 4px;
			background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
			margin: 15px auto 0;
			border-radius: 2px;
		}

		/* 错误消息样式 */
		.error-message {
			background: rgba(255, 107, 107, 0.1);
			color: #d63031;
			padding: 12px;
			border-radius: 8px;
			margin-bottom: 20px;
			font-size: 14px;
			border-left: 4px solid #d63031;
		}

		/* header 背景透明 */
		.header {
			background: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(10px);
		}
	</style>
</head>
<body>
	<div class="page-wrap" id="root">
		
		<!-- header -->
		<header class="header header--fixed">
			<div class="header__inner">
				<div class="header__logo"><a href="/index.html"><img src="/assets/img/logo.png" alt="" style="width: 122px;"/></a></div>
				<div class="navbar-toggle" id="fs-button">
					<div class="navbar-icon"><span></span></div>
				</div>
			</div>
			
			<!-- fullscreenmenu__module -->
			<div class="fullscreenmenu__module" trigger="#fs-button">
				
				<ul class="wil-menu-list">
					<li class="current-menu-item"><a href="/index.html">首页</a>
					</li>
					<li><a href="/about.html">关于我们</a>
					</li>
					<li><a href="/blog.html">新闻列表</a>
					</li>
					<li><a href="/message.html">留言板</a></li>

					<li th:if="${isAdmin}"><a href="/article/list">管理</a></li>

					<li><a href="/logout">登出</a></li>
					
				</nav>
				
			</div><!-- End / fullscreenmenu__module -->
			
		</header><!-- End / header -->
		
		<!-- Content-->
		<div class="wil-content">
			
			<!-- Section -->
			<section class="awe-section" style="padding-top: 80px; padding-bottom: 80px;">
				<div class="container">
					
					<div class="row">
						<div class="col-lg-6 offset-lg-3 col-md-8 offset-md-2 col-sm-10 offset-sm-1">
							
							<!-- login-form -->
							<div class="login-form">
								
								<!-- page-title -->
								<div class="page-title">
									<h2 class="page-title__title">用户登录</h2>
									<div class="page-title__divider"></div>
								</div><!-- End / page-title -->
								
								<form action="/dologin" method="post">
									
									<!-- input-item -->
									<div class="input-item">
										<input type="text" name="username" placeholder="请输入用户名" required>
									</div><!-- End / input-item -->
									
									<!-- input-item -->
									<div class="input-item">
										<input type="password" name="password" placeholder="请输入密码" required>
									</div><!-- End / input-item -->
									
									<!-- error message -->
									<div th:if="${error != null}" class="error-message">
										[[${error}]]
									</div>
									
									<!-- btn-item -->
									<div class="btn-item">
										<button type="submit" class="btn">登录</button>
									</div><!-- End / btn-item -->
									
								</form>
								
							</div><!-- End / login-form -->
							
						</div>
					</div>
					
				</div>
			</section>
			<!-- End / Section -->
			
		</div><!-- End / Content-->
		
	</div><!-- End / page-wrap -->
	
	<!-- Vendors--> 
	<script type="text/javascript" src="/assets/vendors/jquery/jquery.min.js"></script>
	<script type="text/javascript" src="/assets/vendors/jquery.matchHeight/jquery.matchHeight.min.js"></script>
	<script type="text/javascript" src="/assets/vendors/jquery.waypoints/jquery.waypoints.min.js"></script>
	<script type="text/javascript" src="/assets/vendors/magnific-popup/jquery.magnific-popup.min.js"></script>
	<script type="text/javascript" src="/assets/vendors/isotope-layout/isotope.pkgd.js"></script>
	<script type="text/javascript" src="/assets/vendors/imagesloaded/imagesloaded.pkgd.js"></script>
	<script type="text/javascript" src="/assets/vendors/masonry-layout/masonry.pkgd.js"></script>
	<script type="text/javascript" src="/assets/vendors/slider/slider.js"></script>
	<script type="text/javascript" src="/assets/vendors/menu/menu.js"></script>
	<script type="text/javascript" src="/assets/vendors/typed/typed.min.js"></script>
	<script type="text/javascript" src="/assets/vendors/swiper/swiper.jquery.js"></script>
	<script type="text/javascript" src="/assets/vendors/jquery-one-page/jquery.nav.min.js"></script>
	<script type="text/javascript" src="/assets/vendors/jquery.easing/jquery.easing.min.js"></script>
	<!-- App-->
	<script type="text/javascript" src="/assets/js/main.js"></script>
	
</body>
</html>
