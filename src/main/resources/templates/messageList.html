<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>留言管理</title>
    <link rel="stylesheet" type="text/css" href="/assets/fonts/fontawesome/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="/assets/fonts/pe-icon/pe-icon.css">
    <link rel="stylesheet" type="text/css" href="/assets/vendors/bootstrap/grid.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/main.css">
    <style>
        /* 复用评论管理的样式 */
        .comment-content { max-width: 300px; word-wrap: break-word; }
    </style>
</head>
<body>
<div class="page-wrap" id="root">
    <header class="header header--fixed">
        <div class="header__inner">
            <div class="header__logo"><a href="/index.html"><img src="/assets/img/logo.png" alt="" style="width: 122px;"/></a></div>
            <div class="navbar-toggle" id="fs-button"><div class="navbar-icon"><span></span></div></div>
        </div>
        <div class="fullscreenmenu__module" trigger="#fs-button">
            <nav class="overlay-menu">
                <ul class="wil-menu-list">
                    <li><a href="/index.html">首页</a></li>
                    <li><a href="/about.html">关于我们</a></li>
                    <li><a href="/work.html">栏目分类</a></li>
                    <li><a href="/blog.html">新闻列表</a></li>
                    <li><a href="/message.html">留言板</a></li>
                    <li th:if="${session.user != null}"><a href="/article/list">管理页</a></li>
                    <li th:if="${session.user == null}"><a href="/login.html">登录</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="wil-content">
        <section class="awe-section">
            <div class="container">
                <div class="page-title">
                    <h2 class="page-title__title">留言管理</h2>
                    <div class="page-title__divider"></div>
                    <div class="admin-tabs">
                        <a class="btn btn-sm" href="/article/list">文章管理</a>
                        <a class="btn btn-sm" href="/user/list">用户管理</a>
                        <a class="btn btn-sm" href="/article/like/list">点赞管理</a>
                        <a class="btn btn-sm" href="/article/favorite/list">收藏管理</a>
                        <a class="btn btn-sm active" href="/message/list">留言管理</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="awe-section">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="box">
                            <table class="table table-bordered table-hover">
                                <thead>
                                <tr>
                                    <th>留言ID</th>
                                    <th>姓名</th>
                                    <th>邮箱</th>
                                    <th>内容</th>
                                    <th>时间</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${list}" th:attr="data-id=${item.id}">
                                    <td th:text="${item.id}"></td>
                                    <td th:text="${item.name}">姓名</td>
                                    <td th:text="${item.email}">邮箱</td>
                                    <td><div class="comment-content" th:text="${#strings.abbreviate(item.content,50)}">内容</div></td>
                                    <td th:text="${item.createdAt}">时间</td>
                                    <td>
                                        <button type="button" class="btn btn-info btn-sm" th:onclick="'viewMessage(' + ${item.id} + ')'">
                                            <i class="fa fa-eye"></i> 查看
                                        </button>
                                        <button type="button" class="btn btn-danger btn-sm" th:onclick="'deleteMessage(' + ${item.id} + ')'">
                                            <i class="fa fa-trash"></i> 删除
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script type="text/javascript" src="/assets/vendors/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="/assets/js/main.js"></script>
    <script>
        function deleteMessage(id) {
            if (confirm('确定要删除这条留言吗？')) {
                $.post('/message/delete/' + id, function (res) {
                    if (res.success) {
                        alert('删除成功'); location.reload();
                    } else {
                        alert('删除失败: ' + res.message);
                    }
                }).fail(function () { alert('请求失败'); });
            }
        }
        function viewMessage(id) {
            $.get('/message/view/' + id, function (res) {
                if (res.success) {
                    var m = res.data;
                    var win = window.open('', '_blank', 'width=600,height=400');
                    win.document.write('<h3>留言详情</h3>');
                    win.document.write('<p><strong>姓名：</strong>' + (m.name||'匿名') + '</p>');
                    win.document.write('<p><strong>邮箱：</strong>' + (m.email||'') + '</p>');
                    win.document.write('<p><strong>内容：</strong><pre>' + (m.content||'') + '</pre></p>');
                    win.document.write('<p><strong>时间：</strong>' + (m.createdAt||'') + '</p>');
                } else {
                    alert(res.message || '获取失败');
                }
            }).fail(function () { alert('请求失败'); });
        }
    </script>
</div>
</body>
</html>
